:root {
  --ink: #e9edf1; --dim: #9aa5b1; --panel: rgba(16,20,25,0.86); --line: rgba(255,255,255,0.09);
  --amber: #f2b632; --red: #ff3b2a; --green: #3ddc6e; --mono: "LBMono", "DejaVu Sans Mono", Consolas, monospace;
  --sans: "LBSans", "DejaVu Sans", "Segoe UI", Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #07090c; color: var(--ink); font-family: var(--sans); overflow: hidden; }
#stage, #stage canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
button { font-family: var(--sans); }

#loading { position: fixed; inset: 0; display: grid; place-items: center; background: #07090c; z-index: 50; transition: opacity .5s; font-family: var(--mono); letter-spacing: .2em; color: var(--dim); }
#loading.gone { opacity: 0; pointer-events: none; }
#loading b { display: block; color: var(--amber); font-size: 28px; letter-spacing: .25em; margin-bottom: 10px; text-align: center; }

.screen { position: fixed; inset: 0; display: none; z-index: 10; pointer-events: none; }
.screen.show { display: block; }
.screen .card { pointer-events: auto; }

/* Title */
#title .card {
  position: absolute; left: clamp(16px, 5vw, 72px); top: 50%; transform: translateY(-50%);
  width: min(360px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow: auto;
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 24px 22px 20px;
  box-shadow: 0 30px 80px rgba(0,0,0,.55); backdrop-filter: blur(6px);
}
.logo { font-family: var(--mono); font-weight: bold; font-size: 38px; letter-spacing: .08em; line-height: 1; margin-bottom: 18px; }
.logo span { color: var(--amber); }
#modes { display: grid; gap: 8px; }
.mode {
  display: flex; flex-direction: column; align-items: flex-start; gap: 3px; width: 100%; text-align: left; cursor: pointer;
  background: #0d1116; color: var(--ink); border: 1px solid #2a323b; border-radius: 10px; padding: 11px 14px;
  transition: border-color .15s, background .15s, transform .1s;
}
.mode:hover { border-color: var(--amber); background: #141a21; }
.mode:active { transform: translateY(1px); }
.mname { font-weight: bold; font-size: 15px; letter-spacing: .06em; text-transform: uppercase; }
.mstats { font-family: var(--mono); font-size: 12px; color: var(--dim); }
.btn {
  appearance: none; border: 0; border-radius: 9px; padding: 12px 18px; font-weight: bold; letter-spacing: .12em;
  cursor: pointer; font-size: 14px; color: #1a1205; background: linear-gradient(#ffc94a, #e09a12);
  box-shadow: 0 2px 0 #8a5a06, 0 8px 22px rgba(240,170,30,.25);
}
.btn:active { transform: translateY(1px); box-shadow: 0 1px 0 #8a5a06; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid #39424c; box-shadow: none; }

/* HUD */
#hud { position: fixed; left: 0; right: 0; top: 0; display: none; justify-content: space-between; align-items: flex-start; padding: 14px 16px; z-index: 5; pointer-events: none; }
body.playing #hud { display: flex; }
#hud .btns { display: flex; gap: 8px; pointer-events: auto; }
#hud .btns button { background: rgba(10,12,15,.7); color: var(--ink); border: 1px solid #39424c; border-radius: 8px; padding: 8px 12px; font-size: 13px; cursor: pointer; letter-spacing: .06em; }

/* Result */
#result .card {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); width: min(420px, calc(100vw - 32px));
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 28px; text-align: center;
  box-shadow: 0 30px 80px rgba(0,0,0,.6);
}
#resTitle { font-family: var(--mono); font-size: 40px; font-weight: bold; letter-spacing: .1em; }
#resTitle.win { color: var(--green); text-shadow: 0 0 24px rgba(61,220,110,.4); }
#resTitle.lose { color: var(--red); text-shadow: 0 0 24px rgba(255,59,42,.45); }
#resReason { color: var(--dim); margin: 6px 0 18px; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 20px; text-align: left; }
.stats div { border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; font-size: 12px; color: var(--dim); }
.stats b { display: block; font-family: var(--mono); color: var(--ink); font-size: 16px; margin-top: 2px; }
.resBtns { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }

#flash { position: fixed; inset: 0; pointer-events: none; z-index: 20; opacity: 0; }
#flash.strike { animation: strike .5s ease-out; box-shadow: inset 0 0 160px 40px rgba(255,30,20,.75); }
#flash.boom { animation: boom .45s ease-out forwards; background: #fff3d6; }
@keyframes strike { 0% { opacity: 1; } 100% { opacity: 0; } }
@keyframes boom { 0% { opacity: .9; } 100% { opacity: 0; } }

@media (max-width: 760px) {
  #title .card { top: auto; bottom: 16px; transform: none; max-height: 70vh; }
}
</style>
</head>
<body>
<div id="stage"></div>
<div id="loading"><div><b>LOGIC BOMB</b>machining the casing…</div></div>

<div id="title" class="screen">
  <div class="card">
    <div class="logo">LOGIC <span>BOMB</span></div>
    <div id="modes"></div>
  </div>
</div>

<div id="hud">
  <div></div>
  <div class="btns"><button id="quit">Menu</button></div>
</div>

<div id="result" class="screen">
  <div class="card">
    <div id="resTitle">BOOM</div>
    <div id="resReason"></div>
    <div class="stats">
      <div>Time left<b id="resTime">0:00</b></div>
      <div>Strikes<b id="resStrikes">0</b></div>
      <div style="grid-column: span 2">Mode<b id="resMode">—</b></div>
    </div>
    <div class="resBtns">
      <button class="btn" id="retry">RETRY SAME BOMB</button>
      <button class="btn ghost" id="newBomb">NEW BOMB</button>
      <button class="btn ghost" id="toMenu">MENU</button>
    </div>
  </div>
</div>
